name: macOS desktop package
on:
  workflow_dispatch:
  push:
    branches: [main, codex/desktop-refactor]
    tags: ['v*']
permissions:
  contents: write
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - run: python -m pip install -e ".[dev]" pyinstaller
      - run: python -m pytest
      - run: npm ci
        working-directory: apps/desktop
      - run: node node_modules/electron/install.js
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop
      - run: npm test
        working-directory: apps/desktop
      - run: python -m PyInstaller --clean --noconfirm --distpath apps/desktop/runtime/python --workpath build/jobfindsme-api scripts/jobfindsme_api.spec
      - run: node scripts/package-macos.mjs
        working-directory: apps/desktop
      - run: node scripts/audit-macos-package.mjs
        working-directory: apps/desktop
      - run: npm install --no-save --package-lock=false playwright
        working-directory: apps/desktop
      - run: node scripts/smoke-desktop.mjs
        working-directory: apps/desktop
      - name: Archive tested application
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent apps/desktop/release/mac-unpacked/JobFindsMe.app dist/mac-arm64.zip
          shasum -a 256 dist/mac-arm64.zip | tee dist/mac-arm64.SHA256.txt dist/SHA256.txt >/dev/null
          cp apps/desktop/release/mac-unpacked/*.png dist/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: JobFindsMe-mac-arm64
          path: |
            dist/mac-arm64.zip
            dist/SHA256.txt
            dist/*.png
      - name: Publish macOS asset to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mac-arm64.zip
            dist/mac-arm64.SHA256.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
