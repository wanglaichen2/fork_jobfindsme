name: Windows desktop package
on:
  workflow_dispatch:
  push:
    branches: [main, codex/desktop-refactor]
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e ".[dev]" pyinstaller
      - run: python -m pytest
      - run: npm ci
        working-directory: apps/desktop
      - name: Install Electron binary explicitly
        run: node node_modules/electron/install.js
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop
      - run: npm test
        working-directory: apps/desktop
      - run: python -m PyInstaller --clean --noconfirm --distpath apps/desktop/runtime/python --workpath build/jobfindsme-api scripts/jobfindsme_api.spec
      - run: node scripts/package-windows.mjs
        working-directory: apps/desktop
      - run: node scripts/audit-windows-package.mjs
        working-directory: apps/desktop
      - run: npm install --no-save --package-lock=false playwright
        working-directory: apps/desktop
      - run: node scripts/smoke-desktop.mjs
        working-directory: apps/desktop
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path apps/desktop/release/windows/JobFindsMe -DestinationPath dist/JobFindsMe-windows-x64.zip -Force
          Copy-Item dist/JobFindsMe-windows-x64.zip dist/windows-x64.zip -Force
          Get-FileHash dist/windows-x64.zip -Algorithm SHA256 | Format-List | Out-File dist/windows-x64.SHA256.txt
          Copy-Item dist/windows-x64.SHA256.txt dist/SHA256.txt -Force
          Copy-Item apps/desktop/release/windows/*.png dist -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: JobFindsMe-windows-x64
          path: |
            dist/JobFindsMe-windows-x64.zip
            dist/windows-x64.zip
            dist/SHA256.txt
            dist/*.png
      - name: Publish Windows asset to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/windows-x64.zip
            dist/windows-x64.SHA256.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
