name: Create draft release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag such as v0.15.2
        required: true
permissions:
  contents: write
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Create or refresh draft release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG:-}" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Tag must look like v0.15.2, got: $TAG" >&2; exit 1 ;;
          esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            gh release view "$TAG" --json isDraft,url
          else
            gh release create "$TAG" --draft --title "$TAG" --notes "Draft desktop packages for $TAG.

After Windows/macOS package workflows succeed on this commit, run **Attach verified desktop release** with each package run ID and this tag.

Do not publish until both assets are attached and checksums are verified."
            echo "Created draft release $TAG"
          fi
